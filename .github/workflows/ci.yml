name: SSD CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-scan:
    # Self-hosted runner required: SonarQube runs locally via
    # docker-compose on http://127.0.0.1:9000, which only a runner
    # on this same machine can reach.
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./web
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt pytest requests

      - name: Run Integration Tests
        working-directory: ./web
        run: python -m pytest tests/test_integration.py -v

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'SSD-Practical'
          path: './web'
          format: 'HTML'
          out: './reports'

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: ./reports

      - name: Run UI Tests over HTTP
        working-directory: ./web
        run: python -m pytest tests/test_ui_http.py -v

      - name: Set up Java (required by sonar-scanner CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_HOST_URL: 'http://127.0.0.1:9000'
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ./web
          args: >
            -Dsonar.projectKey=SSD-Practical
            -Dsonar.sources=.
            -Dsonar.host.url=http://127.0.0.1:9000

      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: 'http://127.0.0.1:9000'
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}